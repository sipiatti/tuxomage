[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tuxomage"
version = "0.1.0"
description = "Vidám pingvines tornyos kártyajáték (Arcomage-stílus) – a cheerful penguin tower-building card game"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Siposs Attila", email = "sipiatti@gmail.com" }]
maintainers = [{ name = "Siposs Attila", email = "sipiatti@gmail.com" }]
keywords = ["game", "card game", "arcomage", "tower", "penguin", "linux", "pygame"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Topic :: Games/Entertainment :: Board Games",
    "Natural Language :: Hungarian",
    "Natural Language :: English",
]
# pygame 2.x (Debian/Ubuntu: python3-pygame) – pygame-ce works as well
dependencies = ["pygame>=2.1"]

[project.optional-dependencies]
dev = ["pytest", "cairosvg", "numpy"]

[project.scripts]
tuxomage = "tuxomage.app:main"

[tool.setuptools]
packages = ["tuxomage"]

[tool.setuptools.package-data]
tuxomage = ["assets/fonts/*", "assets/icons/*.png", "assets/penguins/*.png", "assets/cardart/*.png",
            "assets/svg/*.svg", "assets/sounds/*.wav", "assets/music/*.ogg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
